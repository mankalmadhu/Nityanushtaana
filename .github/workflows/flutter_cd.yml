name: Flutter CD (Play Store)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    tags:
      - 'rig-sandhya-v*' # Also trigger CD when pushing a release tag

jobs:
  deploy_android:
    name: Build and Deploy to Play Store
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./flutter_rig_sandhya

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create keystore and key.properties
        env:
          KEYSTORE_JKS: ${{ secrets.KEYSTORE_JKS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo $KEYSTORE_JKS | base64 --decode > android/app/keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build Android App Bundle
        run: |
          # Extract version name directly from pubspec.yaml (e.g., 3.0.0+1 -> 3.0.0)
          PUBSPEC_VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          if [ -z "$PUBSPEC_VERSION" ]; then
            VERSION_NAME="3.0.0"
          else
            VERSION_NAME=$PUBSPEC_VERSION
          fi
          
          # Calculate a unique, always-increasing build number for Play Store
          BUILD_NUMBER=$((110000 + GITHUB_RUN_NUMBER))
          
          echo "Building version $VERSION_NAME+$BUILD_NUMBER"
          flutter build appbundle --release --build-name=$VERSION_NAME --build-number=$BUILD_NUMBER

      - name: Deploy to Play Store (Internal Track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: vedic.rigveda.sandhyavandana
          releaseFiles: flutter_rig_sandhya/build/app/outputs/bundle/release/app-release.aab
          track: internal # You can change this to alpha, beta, or production
          whatsNewDirectory: flutter_rig_sandhya/whatsnew
          status: completed
