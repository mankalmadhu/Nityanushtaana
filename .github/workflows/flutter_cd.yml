name: Flutter CD (Play Store)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    tags:
      - 'rig-sandhya-v*' # Also trigger CD when pushing a release tag

jobs:
  deploy_android:
    name: Build and Deploy to Play Store
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./flutter_rig_sandhya

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for tags

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create or Verify Tag
        id: manage_tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            # Triggered by tag push
            VERSION_NAME=${GITHUB_REF#refs/tags/rig-sandhya-v}
            echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
            echo "Triggered by tag rig-sandhya-v$VERSION_NAME"
          else
            # Triggered manually via workflow_dispatch
            PUBSPEC_VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
            VERSION_NAME=$PUBSPEC_VERSION
            TAG_NAME="rig-sandhya-v$VERSION_NAME"
            
            echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
            
            if git show-ref --tags --verify --quiet "refs/tags/$TAG_NAME"; then
              echo "Tag $TAG_NAME already exists. Proceeding with build."
            else
              echo "Creating and pushing tag $TAG_NAME..."
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a $TAG_NAME -m "Release $VERSION_NAME"
              git push origin $TAG_NAME
            fi
          fi

      - name: Create keystore and key.properties
        env:
          KEYSTORE_JKS: ${{ secrets.KEYSTORE_JKS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo $KEYSTORE_JKS | base64 --decode > android/app/keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build Android App Bundle
        run: |
          VERSION_NAME=${{ steps.manage_tag.outputs.version }}
          
          # Calculate a unique, always-increasing build number for Play Store
          BUILD_NUMBER=$((110000 + GITHUB_RUN_NUMBER))
          
          echo "Building version $VERSION_NAME+$BUILD_NUMBER"
          flutter build appbundle --release --build-name=$VERSION_NAME --build-number=$BUILD_NUMBER

      - name: Deploy to Play Store (Internal Track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: vedic.rigveda.sandhyavandana
          releaseFiles: flutter_rig_sandhya/build/app/outputs/bundle/release/app-release.aab
          track: internal # You can change this to alpha, beta, or production
          whatsNewDirectory: flutter_rig_sandhya/whatsnew
          status: completed
