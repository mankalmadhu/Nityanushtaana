name: Deploy Web Apps to GitHub Pages

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Rig Sandhya dependencies
        working-directory: ./flutter_rig_sandhya
        run: flutter pub get

      - name: Build Rig Sandhya for Web
        working-directory: ./flutter_rig_sandhya
        run: flutter build web --base-href /Nityanushtaana/rigsandhya/ --release

      - name: Get NityaPuja dependencies
        working-directory: ./flutter_nityapuja
        run: flutter pub get

      - name: Build NityaPuja for Web
        working-directory: ./flutter_nityapuja
        run: flutter build web --base-href /Nityanushtaana/nityapuja/ --release

      - name: Assemble Web Payload
        run: |
          mkdir -p build/web_combined
          
          # Copy Landing Page
          cp github_pages_landing/index.html build/web_combined/
          
          # Copy Rig Sandhya
          cp -R flutter_rig_sandhya/build/web/ build/web_combined/rigsandhya/
          
          # Copy NityaPuja
          cp -R flutter_nityapuja/build/web/ build/web_combined/nityapuja/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web_combined
          publish_branch: gh-pages
          force_orphan: true
